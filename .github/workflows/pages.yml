name: Deploy website to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare current website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/css _site/js/vendor/three _site/assets/photos _site/assets/fonts
          cp index.html bonus.html piano.mp3 .nojekyll _site/
          cp css/{global,pages,room3d,world3d,bonus3d,fonts,typography,memory-desktop}.css _site/css/
          cp js/{config,app,pages,room3d,room3d-loader,bonus}.js _site/js/
          cp js/vendor/three/{three.module.js,three.core.js,LICENSE,README.md} _site/js/vendor/three/
          cp assets/photos/memory-*.jpg _site/assets/photos/
          cp assets/fonts/* _site/assets/fonts/
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
